<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gradient-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b2d" />
      <stop offset="100%" stop-color="#0e1220" />
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0b0f19; stroke: #1d2433; stroke-width: 1.5; }
    .sidebar-border { stroke: #1d2433; stroke-width: 1; }
    
    /* Animations */
    .cursor-pointer {
      animation: moveCursor 8s infinite cubic-bezier(0.25, 1, 0.5, 1);
    }
    .file-highlight {
      animation: fileHighlight 8s infinite;
    }
    .ripple-1 {
      animation: clickRippleEffect1 8s infinite;
    }
    .ripple-2 {
      animation: clickRippleEffect2 8s infinite;
    }
    .context-menu {
      animation: contextMenuReveal 8s infinite cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .menu-highlight {
      animation: menuHover 8s infinite;
    }
    .dashboard-preview {
      animation: dashboardReveal 8s infinite cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes moveCursor {
      0%   { transform: translate(500px, 280px); }
      22%  { transform: translate(110px, 117px); } /* Hovering file */
      25%  { transform: translate(110px, 117px); } /* Right click */
      36%  { transform: translate(250px, 168px); } /* Hovering menu option */
      39%  { transform: translate(250px, 168px); } /* Left click option */
      45%  { transform: translate(320px, 200px); } /* Move away */
      85%  { transform: translate(320px, 200px); } /* Keep preview visible */
      90%  { transform: translate(500px, 280px); } /* Return to start */
      100% { transform: translate(500px, 280px); }
    }

    @keyframes fileHighlight {
      0%, 21%   { fill: transparent; }
      22%, 100% { fill: #3b82f6; fill-opacity: 0.15; }
    }

    @keyframes clickRippleEffect1 {
      0%, 23% { r: 0px; opacity: 0; }
      24%     { r: 2px; opacity: 0.8; }
      26%     { r: 16px; opacity: 0; }
      100%    { r: 16px; opacity: 0; }
    }

    @keyframes clickRippleEffect2 {
      0%, 37% { r: 0px; opacity: 0; }
      38%     { r: 2px; opacity: 0.8; }
      40%     { r: 16px; opacity: 0; }
      100%    { r: 16px; opacity: 0; }
    }

    @keyframes contextMenuReveal {
      0%, 24%   { opacity: 0; transform: translate(125px, 115px) scale(0.95); }
      25%, 39%  { opacity: 1; transform: translate(125px, 115px) scale(1); }
      40%, 100% { opacity: 0; transform: translate(125px, 115px) scale(0.95); }
    }

    @keyframes menuHover {
      0%, 34%   { fill: transparent; }
      35%, 100% { fill: #3b82f6; fill-opacity: 0.25; }
    }

    @keyframes dashboardReveal {
      0%, 39%   { opacity: 0; transform: translate(240px, 45px); filter: blur(4px); }
      44%, 85%  { opacity: 1; transform: translate(240px, 25px); filter: blur(0); }
      90%, 100% { opacity: 0; transform: translate(240px, 15px); filter: blur(4px); }
    }
  </style>

  <!-- Container -->
  <rect class="bg" width="600" height="350" rx="12" />
  <line class="sidebar-border" x1="220" y1="0" x2="220" y2="350" />

  <!-- Sidebar File Browser -->
  <g transform="translate(15, 20)">
    <text x="5" y="15" fill="#5f718f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="700" letter-spacing="1">PROJECT EXPLORER</text>
    
    <!-- Workspace Root Folder -->
    <g transform="translate(0, 35)">
      <!-- Icon (Chevron down + folder) -->
      <path d="M4,3 L8,3 L9,5 L14,5 L14,13 L2,13 L2,3 Z" fill="#60a5fa" />
      <text x="20" y="11" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="600">cortana-project</text>
      
      <!-- Subfolders -->
      <g transform="translate(10, 24)">
        <!-- Folder .agents -->
        <path d="M0,7 L2,5 L4,7" fill="none" stroke="#94a3b8" stroke-width="1.5" />
        <path d="M10,3 L14,3 L15,5 L19,5 L19,13 L8,13 L8,3 Z" fill="#93c5fd" />
        <text x="25" y="11" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">.agents</text>
        
        <!-- Files inside .agents -->
        <g transform="translate(15, 22)">
          <!-- agentos-dashboard.html -->
          <!-- Active Highlight -->
          <rect class="file-highlight" x="-20" y="-3" width="195" height="22" rx="4" />
          
          <path d="M2,2 L10,2 L14,6 L14,14 L2,14 Z" fill="#f43f5e" />
          <path d="M10,2 L10,6 L14,6 Z" fill="#be123c" />
          <text x="20" y="11" fill="#f1f5f9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="600">agentos-dashboard.html</text>
        </g>
        
        <!-- other file -->
        <g transform="translate(15, 46)">
          <path d="M2,2 L10,2 L14,6 L14,14 L2,14 Z" fill="#94a3b8" />
          <text x="20" y="11" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">STATE.md</text>
        </g>
        
        <g transform="translate(15, 70)">
          <path d="M2,2 L10,2 L14,6 L14,14 L2,14 Z" fill="#94a3b8" />
          <text x="20" y="11" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">README.md</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Context Menu (starts transparent, reveals dynamically) -->
  <g class="context-menu" filter="url(#shadow)">
    <rect width="180" height="110" rx="8" fill="#111625" stroke="#252f48" stroke-width="1.2" />
    
    <!-- Menu items -->
    <g transform="translate(8, 6)">
      <!-- Item 1: Open -->
      <text x="10" y="18" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Open</text>
      
      <!-- Divider -->
      <line x1="4" y1="28" x2="160" y2="28" stroke="#1f293d" stroke-width="1" />
      
      <!-- Item 2: Open with Live Server (Highlighted Option) -->
      <g transform="translate(0, 32)">
        <rect class="menu-highlight" x="0" y="0" width="164" height="22" rx="4" />
        
        <!-- Live Server Icon -->
        <circle cx="12" cy="11" r="5" fill="#3b82f6" opacity="0.8" />
        <circle cx="12" cy="11" r="2" fill="#ffffff" />
        
        <text x="24" y="15" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600">Open with Live Server</text>
      </g>
      
      <!-- Divider -->
      <line x1="4" y1="60" x2="160" y2="60" stroke="#1f293d" stroke-width="1" />
      
      <!-- Item 3: Copy Path -->
      <text x="10" y="76" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Copy Path</text>
      
      <!-- Item 4: Rename... -->
      <text x="10" y="94" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">Rename...</text>
    </g>
  </g>

  <!-- Dashboard Preview Area (fades in) -->
  <g class="dashboard-preview">
    <!-- Window Frame -->
    <rect width="330" height="300" rx="10" fill="#0d111d" stroke="#252f48" stroke-width="1.5" />
    
    <!-- Window header bar -->
    <rect width="330" height="24" rx="10" fill="#141927" />
    <circle cx="15" cy="12" r="4" fill="#ff5f56" />
    <circle cx="27" cy="12" r="4" fill="#ffbd2e" />
    <circle cx="39" cy="12" r="4" fill="#27c93f" />
    <text x="165" y="16" fill="#4b5563" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" text-anchor="middle">AgentOS Dashboard</text>
    
    <!-- Mockup dashboard components -->
    <g transform="translate(15, 40)">
      <!-- Title -->
      <rect x="0" y="0" width="100" height="12" rx="3" fill="#3b82f6" opacity="0.8" />
      <rect x="0" y="18" width="150" height="7" rx="2" fill="#334155" />
      
      <!-- Bento Stats Grid -->
      <g transform="translate(0, 35)">
        <!-- Stat card 1 -->
        <rect x="0" y="0" width="90" height="50" rx="6" fill="#151b2d" stroke="#1f293d" stroke-width="1" />
        <rect x="10" y="10" width="30" height="5" rx="1.5" fill="#475569" />
        <rect x="10" y="24" width="45" height="14" rx="3" fill="url(#gradient-accent)" />
        
        <!-- Stat card 2 -->
        <rect x="105" y="0" width="90" height="50" rx="6" fill="#151b2d" stroke="#1f293d" stroke-width="1" />
        <rect x="115" y="10" width="35" height="5" rx="1.5" fill="#475569" />
        <rect x="115" y="24" width="55" height="14" rx="3" fill="#10b981" opacity="0.8" />
        
        <!-- Stat card 3 -->
        <rect x="210" y="0" width="90" height="50" rx="6" fill="#151b2d" stroke="#1f293d" stroke-width="1" />
        <rect x="220" y="10" width="40" height="5" rx="1.5" fill="#475569" />
        <rect x="220" y="24" width="40" height="14" rx="3" fill="#f59e0b" opacity="0.8" />
      </g>
      
      <!-- Big central control center mockup -->
      <g transform="translate(0, 100)">
        <rect width="300" height="135" rx="8" fill="#141a2e" stroke="#252f48" stroke-width="1" />
        
        <!-- Side panel in card -->
        <rect x="10" y="10" width="70" height="115" rx="4" fill="#0d111d" />
        <rect x="18" y="20" width="54" height="8" rx="2" fill="#3b82f6" opacity="0.6" />
        <rect x="18" y="36" width="54" height="8" rx="2" fill="#334155" />
        <rect x="18" y="52" width="54" height="8" rx="2" fill="#334155" />
        
        <!-- Content panel in card -->
        <rect x="90" y="10" width="200" height="115" rx="4" fill="#0d111d" />
        <circle cx="110" cy="30" r="10" fill="#8b5cf6" opacity="0.3" />
        <circle cx="110" cy="30" r="4" fill="#8b5cf6" />
        
        <rect x="130" y="22" width="100" height="8" rx="2" fill="#e2e8f0" opacity="0.9" />
        <rect x="130" y="34" width="140" height="5" rx="1.5" fill="#475569" />
        
        <!-- Mini code lines -->
        <rect x="105" y="55" width="170" height="6" rx="2" fill="#1e293b" />
        <rect x="105" y="67" width="150" height="6" rx="2" fill="#1e293b" />
        <rect x="105" y="79" width="160" height="6" rx="2" fill="#1e293b" />
        <rect x="105" y="91" width="120" height="6" rx="2" fill="#1e293b" />
      </g>
    </g>
  </g>

  <!-- Mouse Pointer cursor with ripples -->
  <g class="cursor-pointer">
    <!-- Click ripples -->
    <circle class="ripple-1" cx="0" cy="0" r="0" fill="none" stroke="#60a5fa" stroke-width="2" />
    <circle class="ripple-2" cx="0" cy="0" r="0" fill="none" stroke="#60a5fa" stroke-width="2" />
    
    <!-- Cursor arrow -->
    <g transform="rotate(-22)">
      <path d="M0,0 L0,18 L5,13.5 L10.5,23 L13,21.5 L7.5,12.5 L13,12 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </g>
  </g>
</svg>
