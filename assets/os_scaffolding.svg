<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OS Scaffolding">
  <style>
    /* Master build: 12s. drone visits pedestal 1 → 2 → 3, materializing racks */
    .drone { animation: droneRoute 12s ease-in-out infinite; }
    @keyframes droneRoute {
      0%,22%  { transform: translateX(0); }
      30%,52% { transform: translateX(250px); }
      60%,88% { transform: translateX(500px); }
      100%    { transform: translateX(0); }
    }
    .drone-bob { animation: bob 1.6s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-9px); } }
    .rotor { transform-box: fill-box; transform-origin: center; animation: rotorSpin .18s linear infinite; }
    @keyframes rotorSpin { from { transform: scaleX(1); } 50% { transform: scaleX(.15); } to { transform: scaleX(1); } }

    .laser { transform-box: fill-box; transform-origin: top center; opacity: 0; }
    .laser-1 { animation: fire1 12s linear infinite; }
    .laser-2 { animation: fire2 12s linear infinite; }
    .laser-3 { animation: fire3 12s linear infinite; }
    @keyframes fire1 { 0%,6% {opacity:0; transform:scaleY(0);} 8%,20% {opacity:1; transform:scaleY(1);} 22%,100% {opacity:0; transform:scaleY(0);} }
    @keyframes fire2 { 0%,32% {opacity:0; transform:scaleY(0);} 34%,50% {opacity:1; transform:scaleY(1);} 52%,100% {opacity:0; transform:scaleY(0);} }
    @keyframes fire3 { 0%,62% {opacity:0; transform:scaleY(0);} 64%,84% {opacity:1; transform:scaleY(1);} 86%,100% {opacity:0; transform:scaleY(0);} }

    .wire { fill: none; stroke: #22d3ee; stroke-width: 1.5; stroke-dasharray: 6 5;
      animation: wirePulse 2s ease-in-out infinite alternate; }
    @keyframes wirePulse { from { opacity: .25; } to { opacity: .85; } }
    .wire-1 { animation: wireGone1 12s linear infinite; }
    .wire-2 { animation: wireGone2 12s linear infinite; }
    .wire-3 { animation: wireGone3 12s linear infinite; }
    @keyframes wireGone1 { 0%,8% {opacity:.7;} 18%,94% {opacity:0;} 99%,100% {opacity:.7;} }
    @keyframes wireGone2 { 0%,34% {opacity:.7;} 48%,94% {opacity:0;} 99%,100% {opacity:.7;} }
    @keyframes wireGone3 { 0%,64% {opacity:.7;} 82%,94% {opacity:0;} 99%,100% {opacity:.7;} }

    .rack { transform-box: fill-box; transform-origin: bottom center; opacity: 0; }
    .rack-1 { animation: build1 12s cubic-bezier(.2,.9,.3,1.2) infinite; }
    .rack-2 { animation: build2 12s cubic-bezier(.2,.9,.3,1.2) infinite; }
    .rack-3 { animation: build3 12s cubic-bezier(.2,.9,.3,1.2) infinite; }
    @keyframes build1 { 0%,9%  {opacity:0; transform:scaleY(.05);} 20%,95% {opacity:1; transform:scaleY(1);} 99%,100% {opacity:0; transform:scaleY(.05);} }
    @keyframes build2 { 0%,36% {opacity:0; transform:scaleY(.05);} 50%,95% {opacity:1; transform:scaleY(1);} 99%,100% {opacity:0; transform:scaleY(.05);} }
    @keyframes build3 { 0%,66% {opacity:0; transform:scaleY(.05);} 84%,95% {opacity:1; transform:scaleY(1);} 99%,100% {opacity:0; transform:scaleY(.05);} }

    .led { animation: blink 1.1s steps(2,start) infinite; }
    .led.g { fill: #22ff88; } .led.c { fill: #22d3ee; } .led.a { fill: #ffb020; }
    @keyframes blink { 50% { opacity: .15; } }

    .impact { fill: none; stroke: #22ff88; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .impact-1 { animation: imp1 12s ease-out infinite; }
    .impact-2 { animation: imp2 12s ease-out infinite; }
    .impact-3 { animation: imp3 12s ease-out infinite; }
    @keyframes imp1 { 0%,8% {opacity:0; transform:scale(.2);} 10% {opacity:1;} 20% {opacity:0; transform:scale(1.7);} 100% {opacity:0;} }
    @keyframes imp2 { 0%,34% {opacity:0; transform:scale(.2);} 36% {opacity:1;} 50% {opacity:0; transform:scale(1.7);} 100% {opacity:0;} }
    @keyframes imp3 { 0%,64% {opacity:0; transform:scale(.2);} 66% {opacity:1;} 84% {opacity:0; transform:scale(1.7);} 100% {opacity:0;} }

    .scanbar { animation: sweep 6s ease-in-out infinite alternate; opacity: .35; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(720px); } }
    .done-lamp { animation: doneCycle 12s linear infinite; }
    @keyframes doneCycle { 0%,85% { fill: #ffb020; } 88%,96% { fill: #22ff88; } 99%,100% { fill: #ffb020; } }
  </style>

  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04101e"/><stop offset="1" stop-color="#082032"/>
    </linearGradient>
    <linearGradient id="rackHull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#365a7a"/><stop offset=".5" stop-color="#173248"/><stop offset="1" stop-color="#0c2032"/>
    </linearGradient>
    <linearGradient id="laserG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22ff88" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".25"/>
    </linearGradient>
    <filter id="glowG5" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowC5" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0f3350" stroke-width="1"/>
    </pattern>
    <!-- detailed server rack template -->
    <g id="serverRack">
      <rect x="-42" y="-118" width="84" height="118" rx="6" fill="url(#rackHull)" stroke="#4d80a8" stroke-width="2"/>
      <rect x="-34" y="-108" width="68" height="18" rx="3" fill="#061524" stroke="#28506e" stroke-width="1"/>
      <rect x="-34" y="-84"  width="68" height="18" rx="3" fill="#061524" stroke="#28506e" stroke-width="1"/>
      <rect x="-34" y="-60"  width="68" height="18" rx="3" fill="#061524" stroke="#28506e" stroke-width="1"/>
      <rect x="-34" y="-36"  width="68" height="24" rx="3" fill="#061524" stroke="#28506e" stroke-width="1"/>
      <path d="M-26 -99 h26 M-26 -75 h26 M-26 -51 h26" stroke="#28506e" stroke-width="3" stroke-linecap="round"/>
      <path d="M-26 -30 h18 M-26 -22 h30" stroke="#28506e" stroke-width="2.5" stroke-linecap="round"/>
      <g filter="url(#glowC5)">
        <circle class="led g" cx="22" cy="-99" r="3"/><circle class="led c" cx="12" cy="-99" r="3" style="animation-delay:.3s"/>
        <circle class="led c" cx="22" cy="-75" r="3" style="animation-delay:.5s"/><circle class="led a" cx="12" cy="-75" r="3" style="animation-delay:.8s"/>
        <circle class="led g" cx="22" cy="-51" r="3" style="animation-delay:.2s"/><circle class="led c" cx="12" cy="-51" r="3" style="animation-delay:.65s"/>
        <circle class="led g" cx="24" cy="-26" r="3.5" style="animation-delay:.4s"/>
      </g>
    </g>
    <!-- wireframe pedestal template -->
    <g id="pedestalWire">
      <polygon points="-52,0 52,0 40,-14 -40,-14" class="wire"/>
      <rect x="-40" y="-118" width="80" height="104" class="wire" rx="5"/>
      <path d="M-30 -104 h60 M-30 -80 h60 M-30 -56 h60 M-30 -32 h60" class="wire"/>
      <path d="M-40 -118 L-52 0 M40 -118 L52 0" class="wire"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#bg5)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect class="scanbar" x="0" y="0" width="80" height="500" fill="#0e4a6e" opacity=".3"/>

  <!-- blueprint frame -->
  <g fill="none" stroke="#1d5f8a" stroke-width="2">
    <path d="M24 24 h60 M24 24 v60 M776 24 h-60 M776 24 v60 M24 476 h60 M24 476 v-60 M776 476 h-60 M776 476 v-60"/>
  </g>
  <circle class="done-lamp" cx="762" cy="38" r="6" filter="url(#glowG5)"/>
  <path d="M60 430 H740" stroke="#1d5f8a" stroke-width="2" stroke-dasharray="12 8"/>
  <path d="M60 438 H740" stroke="#0f3350" stroke-width="4"/>

  <!-- ===== Pedestal 1 ===== -->
  <g transform="translate(150 430)">
    <g class="wire-1"><use href="#pedestalWire"/></g>
    <g class="rack rack-1"><use href="#serverRack"/></g>
    <circle class="impact impact-1" cx="0" cy="-60" r="40"/>
  </g>
  <!-- ===== Pedestal 2 ===== -->
  <g transform="translate(400 430)">
    <g class="wire-2"><use href="#pedestalWire"/></g>
    <g class="rack rack-2"><use href="#serverRack"/></g>
    <circle class="impact impact-2" cx="0" cy="-60" r="40"/>
  </g>
  <!-- ===== Pedestal 3 ===== -->
  <g transform="translate(650 430)">
    <g class="wire-3"><use href="#pedestalWire"/></g>
    <g class="rack rack-3"><use href="#serverRack"/></g>
    <circle class="impact impact-3" cx="0" cy="-60" r="40"/>
  </g>

  <!-- ===== Constructor drone ===== -->
  <g class="drone">
    <g class="drone-bob" transform="translate(150 130)">
      <!-- lasers (anchored below emitter) -->
      <g transform="translate(0 34)">
        <polygon class="laser laser-1" points="-3,0 3,0 10,178 -10,178" fill="url(#laserG)" filter="url(#glowG5)"/>
        <polygon class="laser laser-2" points="-3,0 3,0 10,178 -10,178" fill="url(#laserG)" filter="url(#glowG5)"/>
        <polygon class="laser laser-3" points="-3,0 3,0 10,178 -10,178" fill="url(#laserG)" filter="url(#glowG5)"/>
      </g>
      <!-- arms + rotors -->
      <g stroke="#3f6a8f" stroke-width="4" stroke-linecap="round">
        <line x1="-24" y1="-8" x2="-52" y2="-20"/><line x1="24" y1="-8" x2="52" y2="-20"/>
      </g>
      <ellipse class="rotor" cx="-52" cy="-24" rx="26" ry="4.5" fill="#9fd8ff" opacity=".85"/>
      <ellipse class="rotor" cx="52"  cy="-24" rx="26" ry="4.5" fill="#9fd8ff" opacity=".85" style="animation-delay:.07s"/>
      <circle cx="-52" cy="-22" r="4" fill="#28506e"/><circle cx="52" cy="-22" r="4" fill="#28506e"/>
      <!-- body -->
      <path d="M-28 -10 Q0 -26 28 -10 L22 14 Q0 24 -22 14 Z" fill="url(#rackHull)" stroke="#5d94bd" stroke-width="2"/>
      <path d="M-14 -6 Q0 -14 14 -6 L12 4 Q0 10 -12 4 Z" fill="#061524" stroke="#22d3ee" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#22ff88" filter="url(#glowG5)"/>
      <!-- emitter -->
      <path d="M-9 16 L9 16 L5 32 L-5 32 Z" fill="#173248" stroke="#5d94bd" stroke-width="2"/>
      <circle cx="0" cy="34" r="4.5" fill="#22ff88" filter="url(#glowG5)"/>
      <circle cx="-18" cy="12" r="2.5" fill="#ffb020" class="led a" filter="url(#glowC5)"/>
      <circle cx="18" cy="12" r="2.5" fill="#22d3ee" class="led c" filter="url(#glowC5)"/>
    </g>
  </g>
</svg>
