<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes gridPulse {
        0%, 100% { stroke: #1e293b; }
        50% { stroke: #3b82f6; filter: drop-shadow(0 0 5px #3b82f6); }
      }
      @keyframes droneHover {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      @keyframes laserFire1 {
        0%, 15% { opacity: 0; stroke-width: 1; }
        20% { opacity: 1; stroke-width: 8; filter: drop-shadow(0 0 15px #10b981); }
        25%, 100% { opacity: 0; stroke-width: 1; }
      }
      @keyframes laserFire2 {
        0%, 45% { opacity: 0; stroke-width: 1; }
        50% { opacity: 1; stroke-width: 8; filter: drop-shadow(0 0 15px #10b981); }
        55%, 100% { opacity: 0; stroke-width: 1; }
      }
      @keyframes laserFire3 {
        0%, 75% { opacity: 0; stroke-width: 1; }
        80% { opacity: 1; stroke-width: 8; filter: drop-shadow(0 0 15px #10b981); }
        85%, 100% { opacity: 0; stroke-width: 1; }
      }
      @keyframes solidify1 {
        0%, 20% { opacity: 0.2; stroke: #3b82f6; stroke-dasharray: 10 5; fill: none; }
        25%, 100% { opacity: 1; stroke: #10b981; stroke-dasharray: 0; fill: #0f172a; filter: drop-shadow(0 0 10px #10b981); }
      }
      @keyframes solidify2 {
        0%, 50% { opacity: 0.2; stroke: #3b82f6; stroke-dasharray: 10 5; fill: none; }
        55%, 100% { opacity: 1; stroke: #10b981; stroke-dasharray: 0; fill: #0f172a; filter: drop-shadow(0 0 10px #10b981); }
      }
      @keyframes solidify3 {
        0%, 80% { opacity: 0.2; stroke: #3b82f6; stroke-dasharray: 10 5; fill: none; }
        85%, 100% { opacity: 1; stroke: #10b981; stroke-dasharray: 0; fill: #0f172a; filter: drop-shadow(0 0 10px #10b981); }
      }
      @keyframes blinkLights {
        0%, 100% { fill: #10b981; }
        50% { fill: #34d399; filter: drop-shadow(0 0 5px #10b981); }
      }

      .bg { fill: #020617; }
      .perspective-grid { fill: none; stroke-width: 2; animation: gridPulse 6s infinite; }
      
      /* Drone */
      .drone-body { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; rx: 8; }
      .drone-eye { fill: #10b981; }
      .drone-prop { fill: none; stroke: #64748b; stroke-width: 4; stroke-dasharray: 4 2; }
      
      /* Server Rack Wireframes */
      .server-rack { stroke-width: 3; rx: 4; }
      .rack-line { fill: none; stroke: #334155; stroke-width: 2; }
      .light { rx: 2; }
      
      .laser { fill: none; stroke: #10b981; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="800" height="400" class="bg" rx="16" />

  <!-- 3D Perspective Grid Background -->
  <g transform="translate(0, 250)">
    <!-- Horizontal lines -->
    <path d="M 0 0 L 800 0 M -100 40 L 900 40 M -250 100 L 1050 100 M -500 200 L 1300 200" class="perspective-grid" />
    <!-- Vanishing point lines (origin roughly at 400, -150) -->
    <path d="M 400 0 L 400 200 M 350 0 L 250 200 M 450 0 L 550 200 M 300 0 L 100 200 M 500 0 L 700 200 M 250 0 L -50 200 M 550 0 L 850 200 M 200 0 L -200 200 M 600 0 L 1000 200" class="perspective-grid" />
  </g>

  <!-- Scaffold Target 1 -->
  <g transform="translate(150, 200)">
    <!-- Base shadow -->
    <ellipse cx="60" cy="110" rx="70" ry="15" fill="#000000" opacity="0.5" />
    <!-- The Rack Structure -->
    <g class="server-rack" style="animation: solidify1 10s infinite;">
      <rect x="0" y="0" width="120" height="100" class="server-rack" />
      <line x1="20" y1="20" x2="100" y2="20" class="rack-line" />
      <line x1="20" y1="50" x2="100" y2="50" class="rack-line" />
      <line x1="20" y1="80" x2="100" y2="80" class="rack-line" />
      <!-- Blinking lights -->
      <rect x="20" y="25" width="8" height="8" class="light" style="animation: blinkLights 1s infinite 0.1s;" />
      <rect x="35" y="25" width="8" height="8" class="light" style="animation: blinkLights 1.5s infinite 0.5s;" />
      <rect x="20" y="55" width="8" height="8" class="light" style="animation: blinkLights 1.2s infinite 0.2s;" />
      <rect x="20" y="85" width="8" height="8" class="light" style="animation: blinkLights 0.8s infinite 0.8s;" />
    </g>
    <text x="60" y="140" fill="#94a3b8" font-family="monospace" font-size="14px" font-weight="bold" text-anchor="middle">worklog.md</text>
  </g>

  <!-- Scaffold Target 2 -->
  <g transform="translate(340, 200)">
    <ellipse cx="60" cy="110" rx="70" ry="15" fill="#000000" opacity="0.5" />
    <g class="server-rack" style="animation: solidify2 10s infinite;">
      <rect x="0" y="0" width="120" height="100" class="server-rack" />
      <line x1="20" y1="20" x2="100" y2="20" class="rack-line" />
      <line x1="20" y1="50" x2="100" y2="50" class="rack-line" />
      <line x1="20" y1="80" x2="100" y2="80" class="rack-line" />
      <rect x="20" y="25" width="8" height="8" class="light" style="animation: blinkLights 1.1s infinite 0.3s;" />
      <rect x="35" y="25" width="8" height="8" class="light" style="animation: blinkLights 1.6s infinite 0.7s;" />
      <rect x="50" y="25" width="8" height="8" class="light" style="animation: blinkLights 0.9s infinite 0.1s;" />
      <rect x="20" y="85" width="8" height="8" class="light" style="animation: blinkLights 1.4s infinite 0.4s;" />
    </g>
    <text x="60" y="140" fill="#94a3b8" font-family="monospace" font-size="14px" font-weight="bold" text-anchor="middle">business_context.md</text>
  </g>

  <!-- Scaffold Target 3 -->
  <g transform="translate(530, 200)">
    <ellipse cx="60" cy="110" rx="70" ry="15" fill="#000000" opacity="0.5" />
    <g class="server-rack" style="animation: solidify3 10s infinite;">
      <rect x="0" y="0" width="120" height="100" class="server-rack" />
      <line x1="20" y1="20" x2="100" y2="20" class="rack-line" />
      <line x1="20" y1="50" x2="100" y2="50" class="rack-line" />
      <line x1="20" y1="80" x2="100" y2="80" class="rack-line" />
      <rect x="20" y="25" width="8" height="8" class="light" style="animation: blinkLights 1.3s infinite 0.6s;" />
      <rect x="20" y="55" width="8" height="8" class="light" style="animation: blinkLights 0.7s infinite 0.9s;" />
      <rect x="35" y="55" width="8" height="8" class="light" style="animation: blinkLights 1.8s infinite 0.2s;" />
    </g>
    <text x="60" y="140" fill="#94a3b8" font-family="monospace" font-size="14px" font-weight="bold" text-anchor="middle">user_lexicon.md</text>
  </g>

  <!-- Constructor Drone -->
  <g transform="translate(400, 80)" style="animation: droneHover 4s infinite ease-in-out;">
    <!-- Propellers -->
    <path d="M -80 -10 L -40 -10 M 40 -10 L 80 -10" class="drone-prop" />
    <line x1="-60" y1="-10" x2="-60" y2="10" stroke="#64748b" stroke-width="3" />
    <line x1="60" y1="-10" x2="60" y2="10" stroke="#64748b" stroke-width="3" />
    
    <!-- Body -->
    <rect x="-40" y="10" width="80" height="40" class="drone-body" />
    <circle cx="0" cy="30" r="10" class="drone-eye" style="animation: blinkLights 2s infinite;" />
    
    <!-- Constructor Lasers -->
    <!-- Shoots Target 1 -->
    <line x1="0" y1="40" x2="-190" y2="140" class="laser" style="animation: laserFire1 10s infinite;" />
    <!-- Shoots Target 2 -->
    <line x1="0" y1="40" x2="0" y2="140" class="laser" style="animation: laserFire2 10s infinite;" />
    <!-- Shoots Target 3 -->
    <line x1="0" y1="40" x2="190" y2="140" class="laser" style="animation: laserFire3 10s infinite;" />
  </g>

</svg>
