<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @keyframes flowGreen {
        0% { stroke-dashoffset: 400; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { r: 4; fill: #10b981; filter: drop-shadow(0 0 2px #10b981); }
        50% { r: 6; fill: #34d399; filter: drop-shadow(0 0 8px #34d399); }
      }
      @keyframes gearSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gearSpinReverse {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes lockCorePulse {
        0%, 100% { fill: #ef4444; filter: drop-shadow(0 0 10px #ef4444); }
        50% { fill: #f87171; filter: drop-shadow(0 0 20px #ef4444); }
      }
      @keyframes alertText {
        0%, 100% { opacity: 1; fill: #ef4444; }
        50% { opacity: 0.5; }
      }
      
      .bg { fill: #020617; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      .trace-bg { fill: none; stroke: #334155; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .trace-flow { fill: none; stroke: #10b981; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100 300; animation: flowGreen 3s linear infinite; }
      
      /* Base Board Details */
      .chip { fill: #0f172a; stroke: #475569; stroke-width: 2; rx: 4; }
      .pin { fill: #64748b; }
      
      /* Lock Mechanism */
      .lock-container { transform-origin: 500px 200px; cursor: pointer; }
      .gear { fill: none; stroke: #64748b; stroke-width: 4; stroke-dasharray: 8 6; transform-origin: center; }
      .gear-inner { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; }
      .core-red { animation: lockCorePulse 2s infinite; }
      
      /* Hover States */
      .lock-container:hover .gear-left { transform: translateX(-30px) rotate(-180deg); transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
      .lock-container:hover .gear-right { transform: translateX(30px) rotate(180deg); transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
      .lock-container:hover .core-red { fill: #10b981; filter: drop-shadow(0 0 25px #10b981); transition: all 0.5s ease; animation: none; }
      .lock-container:hover .shield-wall { stroke: #10b981; stroke-dasharray: 10 10; transition: all 0.5s ease; }
      .lock-container:hover .t3-trace { stroke: #10b981; animation: flowGreen 2s linear infinite; }
      .lock-container:hover .alert-msg { opacity: 0; }
      .lock-container:hover .approve-msg { opacity: 1; }
      
      .t3-trace { fill: none; stroke: #ef4444; stroke-width: 4; stroke-dasharray: 100 300; stroke-dashoffset: 400; transition: all 0.5s ease; }
      .approve-msg { opacity: 0; fill: #10b981; font-family: monospace; font-weight: bold; font-size: 14px; transition: opacity 0.5s; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" class="bg" rx="16" />
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" class="grid" />
  </pattern>
  <rect width="800" height="300" fill="url(#gridPattern)" rx="16" />

  <!-- Microchips / Nodes Decoration -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="60" height="40" class="chip" />
    <rect x="-5" y="5" width="5" height="5" class="pin" /><rect x="-5" y="15" width="5" height="5" class="pin" /><rect x="-5" y="25" width="5" height="5" class="pin" />
    <rect x="60" y="5" width="5" height="5" class="pin" /><rect x="60" y="15" width="5" height="5" class="pin" /><rect x="60" y="25" width="5" height="5" class="pin" />
  </g>
  <g transform="translate(680, 180)">
    <rect x="0" y="0" width="50" height="50" class="chip" />
    <circle cx="25" cy="25" r="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  </g>

  <!-- T0/T1 Safe Track -->
  <g>
    <!-- Background traces -->
    <path d="M 120 60 L 250 60 L 280 90 L 600 90 L 630 60 L 750 60" class="trace-bg" />
    <path d="M 120 60 L 250 60 L 280 90 L 600 90 L 630 60 L 750 60" class="trace-flow" style="animation-delay: 0s;" />
    <path d="M 120 60 L 250 60 L 280 90 L 600 90 L 630 60 L 750 60" class="trace-flow" style="animation-delay: 1.5s;" />
    <!-- Nodes -->
    <circle cx="250" cy="60" class="node" style="animation: pulseNode 2s infinite 0s;" />
    <circle cx="600" cy="90" class="node" style="animation: pulseNode 2s infinite 1s;" />
  </g>

  <!-- T3 Restricted Track -->
  <g>
    <path d="M 100 200 L 400 200 L 430 200" class="trace-bg" />
    <path d="M 570 200 L 600 200 L 680 200" class="trace-bg" />
  </g>

  <!-- The Interactive Lock Mechanism -->
  <g class="lock-container">
    <!-- Shield Wall -->
    <line x1="430" y1="150" x2="430" y2="250" stroke="#ef4444" stroke-width="6" stroke-dasharray="20 5" stroke-linecap="round" class="shield-wall" />
    <line x1="570" y1="150" x2="570" y2="250" stroke="#ef4444" stroke-width="6" stroke-dasharray="20 5" stroke-linecap="round" class="shield-wall" />
    
    <!-- Data trace trying to pass -->
    <path d="M 100 200 L 400 200 L 430 200 L 570 200 L 680 200" class="t3-trace" />

    <!-- Left Gear Assembly -->
    <g class="gear-left" style="transform-origin: 470px 200px;">
      <g style="animation: gearSpin 6s linear infinite; transform-origin: 470px 200px;">
        <circle cx="470" cy="200" r="30" class="gear" />
        <circle cx="470" cy="200" r="20" class="gear-inner" />
        <path d="M 455 185 L 485 215 M 485 185 L 455 215" stroke="#475569" stroke-width="3" />
      </g>
    </g>

    <!-- Right Gear Assembly -->
    <g class="gear-right" style="transform-origin: 530px 200px;">
      <g style="animation: gearSpinReverse 6s linear infinite; transform-origin: 530px 200px;">
        <circle cx="530" cy="200" r="30" class="gear" />
        <circle cx="530" cy="200" r="20" class="gear-inner" />
        <path d="M 515 185 L 545 215 M 545 185 L 515 215" stroke="#475569" stroke-width="3" />
      </g>
    </g>

    <!-- Center Core -->
    <circle cx="500" cy="200" r="15" class="core-red" />
    
    <!-- Text Elements -->
    <text x="500" y="270" font-family="monospace" font-size="14px" font-weight="bold" text-anchor="middle" class="alert-msg" style="animation: alertText 2s infinite;">[ T3: RED TEAM REVIEW REQUIRED ]</text>
    <text x="500" y="270" class="approve-msg">ACCESS GRANTED: HITL APPROVED</text>
    <text x="500" y="290" fill="#64748b" font-family="sans-serif" font-size="10px" text-anchor="middle">Hover over the lock to simulate human approval</text>
  </g>

</svg>
