<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      @keyframes funnelDrop {
        0% { transform: translateY(-50px) scale(1); opacity: 0; }
        20% { transform: translateY(0) scale(1); opacity: 1; fill: #3b82f6; }
        50% { transform: translateY(60px) scale(0.3); opacity: 1; fill: #8b5cf6; }
        80% { transform: translateY(100px) scale(0.3); opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes writeDisk {
        0%, 60% { opacity: 0; }
        70%, 90% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
        100% { opacity: 0; }
      }
      @keyframes truncateBuffer {
        0%, 80% { opacity: 1; }
        85%, 100% { opacity: 0.1; }
      }
      .bg { fill: #0f172a; rx: 12; }
      .funnel { fill: none; stroke: #334155; stroke-width: 4; stroke-linejoin: round; }
      .disk { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 4; }
      .buffer-box { fill: none; stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 4; rx: 4; animation: truncateBuffer 4s infinite; }
      
      .token { animation: funnelDrop 4s infinite; }
      .disk-write { animation: writeDisk 4s infinite; }
    </style>
  </defs>
  
  <rect width="600" height="200" class="bg" />
  
  <!-- Working Memory Buffer -->
  <g transform="translate(100, 40)">
    <rect x="-50" y="0" width="100" height="80" class="buffer-box" />
    <text x="0" y="-10" fill="#94a3b8" font-family="sans-serif" font-size="12px" text-anchor="middle" font-weight="bold">worklog.md (4k tokens)</text>
    <rect x="-30" y="20" width="60" height="10" rx="2" class="token" style="animation-delay: 0s" />
    <rect x="-30" y="20" width="60" height="10" rx="2" class="token" style="animation-delay: 0.2s" />
    <rect x="-30" y="20" width="60" height="10" rx="2" class="token" style="animation-delay: 0.4s" />
  </g>

  <!-- Compression Funnel -->
  <g transform="translate(300, 60)">
    <path d="M-40,0 L40,0 L15,50 L-15,50 Z" class="funnel" />
    <text x="0" y="-10" fill="#8b5cf6" font-family="sans-serif" font-size="12px" text-anchor="middle" font-weight="bold">1. DISTILL</text>
  </g>

  <!-- Archive Disk -->
  <g transform="translate(480, 80)">
    <rect x="-40" y="0" width="80" height="50" class="disk" />
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#10b981" stroke-width="3" />
    <line x1="-20" y1="25" x2="0" y2="25" stroke="#10b981" stroke-width="3" />
    <text x="0" y="-10" fill="#10b981" font-family="sans-serif" font-size="12px" text-anchor="middle" font-weight="bold">2. APPEND</text>
    
    <!-- Success Verification Pulse -->
    <circle cx="0" cy="25" r="30" fill="none" stroke="#10b981" stroke-width="4" class="disk-write" />
    <text x="0" y="70" class="disk-write" fill="#10b981" font-family="sans-serif" font-size="12px" font-weight="bold" text-anchor="middle">3. VERIFIED</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 170 80 Q 230 80 250 80" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 350 110 Q 400 110 430 110" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)" />
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>
</svg>
