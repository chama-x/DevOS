<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @keyframes suckIn {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
        40% { transform: translate(150px, 80px) scale(0.1) rotate(360deg); opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes centrifugeSpin {
        0% { transform: rotate(0deg) scale(1); }
        30% { transform: rotate(720deg) scale(1.1); filter: drop-shadow(0 0 20px #8b5cf6); }
        50% { transform: rotate(1440deg) scale(1); filter: drop-shadow(0 0 5px #8b5cf6); }
        100% { transform: rotate(1440deg) scale(1); }
      }
      @keyframes coreGlow {
        0%, 35% { r: 0; opacity: 0; }
        40% { r: 15; opacity: 1; fill: #ffffff; filter: drop-shadow(0 0 30px #ffffff); }
        50%, 100% { r: 25; opacity: 1; fill: #10b981; filter: drop-shadow(0 0 20px #10b981); }
      }
      @keyframes scanLaser {
        0%, 55% { transform: translateX(0); opacity: 0; }
        60% { opacity: 1; }
        75% { transform: translateX(80px); opacity: 1; }
        80%, 100% { opacity: 0; transform: translateX(80px); }
      }
      @keyframes vaporization {
        0%, 80% { opacity: 1; filter: none; }
        85% { opacity: 0.5; filter: blur(5px); transform: translateY(-10px); }
        100% { opacity: 0; filter: blur(10px); transform: translateY(-20px); }
      }
      @keyframes commitFlash {
        0%, 85% { opacity: 0; }
        90%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }

      .bg { fill: #020617; }
      .tube { fill: none; stroke: #1e293b; stroke-width: 40; stroke-linecap: round; }
      .tube-inner { fill: none; stroke: #0f172a; stroke-width: 32; stroke-linecap: round; }
      .data-cube { fill: #3b82f6; stroke: #60a5fa; stroke-width: 1; opacity: 0.8; }
      
      .centrifuge-ring { fill: none; stroke: #8b5cf6; stroke-width: 4; stroke-dasharray: 20 10; }
      .centrifuge-hub { fill: #1e293b; stroke: #c084fc; stroke-width: 2; }
      
      .scan-line { stroke: #10b981; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 8px #10b981); }
      
      .disk-drive { fill: #0f172a; stroke: #475569; stroke-width: 3; rx: 8; }
      .disk-slot { fill: #020617; rx: 2; }
    </style>
  </defs>

  <rect width="800" height="300" class="bg" rx="16" />

  <!-- 1. Truncate Zone (Vaporizes at the end) -->
  <g style="animation: vaporization 12s infinite;">
    <!-- Large Intake Tube -->
    <path d="M -50 150 Q 200 150 250 200" class="tube" />
    <path d="M -50 150 Q 200 150 250 200" class="tube-inner" />
    
    <!-- Floating Data Cubes (4k Tokens) -->
    <g transform="translate(50, 100)">
      <!-- Wave 1 -->
      <rect x="0" y="20" width="15" height="15" class="data-cube" style="animation: suckIn 12s infinite 0.1s;" />
      <rect x="30" y="-10" width="10" height="10" class="data-cube" style="animation: suckIn 12s infinite 0.3s;" />
      <rect x="50" y="40" width="12" height="12" class="data-cube" style="animation: suckIn 12s infinite 0.5s;" />
      <rect x="80" y="10" width="18" height="18" class="data-cube" style="animation: suckIn 12s infinite 0.2s;" />
      
      <!-- Wave 2 -->
      <rect x="-20" y="50" width="14" height="14" class="data-cube" style="animation: suckIn 12s infinite 1.1s;" />
      <rect x="10" y="70" width="8" height="8" class="data-cube" style="animation: suckIn 12s infinite 1.3s;" />
      <rect x="90" y="60" width="16" height="16" class="data-cube" style="animation: suckIn 12s infinite 1.5s;" />
      
      <!-- Wave 3 -->
      <rect x="120" y="20" width="12" height="12" class="data-cube" style="animation: suckIn 12s infinite 2.1s;" />
      <rect x="150" y="50" width="20" height="20" class="data-cube" style="animation: suckIn 12s infinite 2.3s;" />
    </g>
    
    <text x="100" y="240" fill="#64748b" font-family="monospace" font-size="14px" font-weight="bold">ACTIVE WORKLOG (4k)</text>
  </g>

  <!-- 2. Distill Centrifuge -->
  <g transform="translate(350, 200)">
    <!-- Base structure -->
    <circle cx="0" cy="0" r="60" fill="#0f172a" stroke="#1e293b" stroke-width="4" />
    
    <!-- Rotating rings -->
    <g style="animation: centrifugeSpin 12s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 0px 0px;">
      <circle cx="0" cy="0" r="50" class="centrifuge-ring" />
      <circle cx="0" cy="0" r="35" class="centrifuge-ring" style="stroke-dasharray: 10 30; stroke: #c084fc;" />
      <path d="M -50 0 L 50 0 M 0 -50 L 0 50 M -35 -35 L 35 35 M -35 35 L 35 -35" stroke="#475569" stroke-width="2" />
      <circle cx="0" cy="0" r="15" class="centrifuge-hub" />
    </g>
    
    <text x="0" y="80" fill="#c084fc" font-family="monospace" font-size="14px" font-weight="bold" text-anchor="middle">DISTILLATION ENGINE</text>
  </g>

  <!-- Flow connecting centrifuge to disk -->
  <path d="M 410 200 L 550 200" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="10 5" />

  <!-- 3 & 4. Archive Disk & Verification -->
  <g transform="translate(550, 140)">
    <rect x="0" y="0" width="150" height="120" class="disk-drive" />
    <rect x="20" y="20" width="110" height="10" class="disk-slot" />
    <rect x="20" y="40" width="110" height="10" class="disk-slot" />
    
    <!-- The Compressed Core (Appends) -->
    <circle cx="75" cy="80" r="0" style="animation: coreGlow 12s infinite;" />
    
    <!-- The Scanning Laser (Verifies) -->
    <g style="animation: scanLaser 12s infinite; transform-origin: center;">
      <line x1="35" y1="50" x2="35" y2="110" class="scan-line" />
      <rect x="30" y="45" width="10" height="5" fill="#10b981" />
      <rect x="30" y="110" width="10" height="5" fill="#10b981" />
    </g>
    
    <text x="75" y="-10" fill="#10b981" font-family="monospace" font-size="14px" font-weight="bold" text-anchor="middle">SAFE ARCHIVE (500t)</text>
  </g>

  <!-- 5. Commit Notification -->
  <g style="animation: commitFlash 12s infinite;">
    <rect x="250" y="40" width="300" height="50" rx="8" fill="#10b981" />
    <text x="400" y="70" fill="#ffffff" font-family="monospace" font-size="18px" font-weight="bold" text-anchor="middle">TRANSACTION COMMITTED ✓</text>
  </g>

</svg>
