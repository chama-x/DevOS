<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      @keyframes injectAttempt {
        0% { transform: translateY(-50px); opacity: 0; }
        20% { transform: translateY(0); opacity: 1; fill: #3b82f6; }
        40% { transform: translateY(0); opacity: 1; fill: #ef4444; } /* Fails */
        60% { transform: translateY(-30px); opacity: 0; } /* Retries */
        80% { transform: translateY(0); opacity: 1; fill: #ef4444; } /* Fails again */
        100% { transform: translateY(0); opacity: 1; fill: #ef4444; } /* Halts */
      }
      @keyframes alertFlash {
        0%, 100% { opacity: 0; }
        80%, 95% { opacity: 1; filter: drop-shadow(0 0 8px #ef4444); }
      }
      .bg { fill: #0f172a; rx: 12; }
      .code-block { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 6; }
      .code-line { stroke: #475569; stroke-width: 4; stroke-linecap: round; }
      .injector { animation: injectAttempt 4s infinite; }
      .alert-box { animation: alertFlash 4s infinite; }
      .hover-zone:hover .injector { animation-play-state: paused; fill: #10b981; }
      .hover-zone:hover .alert-box { display: none; }
    </style>
  </defs>
  
  <rect width="600" height="200" class="bg hover-zone" />
  
  <!-- Target Code Block -->
  <g transform="translate(200, 100)">
    <rect x="-60" y="0" width="120" height="80" class="code-block" />
    <line x1="-40" y1="20" x2="40" y2="20" class="code-line" />
    <line x1="-40" y1="40" x2="20" y2="40" class="code-line" />
    <line x1="-40" y1="60" x2="40" y2="60" class="code-line" />
    <text x="0" y="-15" fill="#94a3b8" font-family="sans-serif" font-size="12px" text-anchor="middle" font-weight="bold">TARGET FILE</text>
  </g>

  <!-- Injector Element -->
  <g transform="translate(200, 30)" class="injector hover-zone">
    <path d="M-20,-20 L20,-20 L0,20 Z" />
    <text x="35" y="5" fill="#cbd5e1" font-family="sans-serif" font-size="12px" font-weight="bold">MUTATION</text>
  </g>

  <!-- Abort Alert -->
  <g transform="translate(400, 100)" class="alert-box">
    <rect x="-60" y="-20" width="120" height="40" rx="4" fill="#ef4444" />
    <text x="0" y="4" fill="#ffffff" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">ABORTED (2 fails)</text>
  </g>
  
  <text x="300" y="180" fill="#64748b" font-family="sans-serif" font-size="10px" text-anchor="middle">Hover to simulate exact match (Safe Injection)</text>
</svg>
