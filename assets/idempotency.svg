<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @keyframes armSequence {
        0%, 10% { transform: translateX(0); }
        /* First Attempt */
        20% { transform: translateX(200px); }
        30% { transform: translateX(200px); }
        35% { transform: translateX(100px); } /* Recoil */
        /* Wait/Spin Gears */
        45% { transform: translateX(100px); }
        /* Second Attempt */
        55% { transform: translateX(200px); }
        65% { transform: translateX(200px); }
        /* Final Abort */
        80%, 100% { transform: translateX(-50px); }
      }
      @keyframes payloadGlow {
        0%, 15% { fill: #3b82f6; filter: drop-shadow(0 0 5px #3b82f6); }
        25%, 30% { fill: #ef4444; filter: drop-shadow(0 0 15px #ef4444); }
        35%, 50% { fill: #3b82f6; filter: drop-shadow(0 0 5px #3b82f6); }
        60%, 65% { fill: #ef4444; filter: drop-shadow(0 0 15px #ef4444); }
        80%, 100% { fill: #475569; filter: none; } /* Powered down */
      }
      @keyframes shieldFlare {
        0%, 15% { opacity: 0; stroke: #3b82f6; }
        25%, 30% { opacity: 1; stroke: #ef4444; filter: drop-shadow(0 0 10px #ef4444); transform: scale(1.05); }
        35%, 50% { opacity: 0; }
        60%, 65% { opacity: 1; stroke: #ef4444; filter: drop-shadow(0 0 10px #ef4444); transform: scale(1.05); }
        100% { opacity: 0; }
      }
      @keyframes gearSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(720deg); }
      }
      @keyframes powerDownGrid {
        0%, 75% { stroke: #334155; }
        85%, 100% { stroke: #0f172a; }
      }
      @keyframes lockdownWall {
        0%, 75% { height: 0; y: 150; opacity: 0; }
        85%, 100% { height: 260px; y: 20px; opacity: 1; fill: #ef4444; filter: drop-shadow(0 0 15px #ef4444); }
      }
      
      .bg { fill: #020617; }
      .hex-grid { fill: none; stroke: #1e293b; stroke-width: 2; animation: powerDownGrid 10s infinite; }
      .arm-base { fill: #0f172a; stroke: #475569; stroke-width: 3; }
      .arm-joint { fill: #334155; stroke: #94a3b8; stroke-width: 2; }
      .arm-piston { fill: #64748b; }
      .shield { fill: none; stroke-width: 4; transform-origin: center; animation: shieldFlare 10s infinite; }
      .interactive-zone:hover * { animation-play-state: paused; }
    </style>
  </defs>

  <rect width="800" height="300" class="bg" rx="16" />

  <!-- Target Hex Grid (The Codebase) -->
  <g transform="translate(600, 150)">
    <!-- Complex Hex Pattern -->
    <path d="M 0 -80 L 70 -40 L 70 40 L 0 80 L -70 40 L -70 -40 Z" class="hex-grid" />
    <path d="M 0 -40 L 35 -20 L 35 20 L 0 40 L -35 20 L -35 -20 Z" class="hex-grid" />
    <path d="M 0 80 L 70 120 L 70 200 L 0 240 L -70 200 L -70 120 Z" class="hex-grid" />
    <path d="M 0 -240 L 70 -200 L 70 -120 L 0 -80 L -70 -120 L -70 -200 Z" class="hex-grid" />
    
    <!-- Protective Shield (Flares on mismatch) -->
    <path d="M -90 -50 L -90 50 L -40 80 L 40 80 L 90 50 L 90 -50 Z" class="shield" />
    
    <text x="0" y="5" fill="#64748b" font-family="monospace" font-size="12px" text-anchor="middle">TARGET_AST</text>
  </g>

  <g class="interactive-zone">
    <!-- Robotic Arm -->
    <g style="animation: armSequence 10s infinite cubic-bezier(0.4, 0, 0.2, 1);">
      <!-- Piston base -->
      <rect x="50" y="130" width="200" height="40" class="arm-base" rx="8" />
      <line x1="50" y1="150" x2="300" y2="150" stroke="#475569" stroke-width="8" />
      
      <!-- Extending Piston -->
      <g transform="translate(250, 140)">
        <rect x="0" y="0" width="100" height="20" class="arm-piston" rx="4" />
        
        <!-- Rotating Gear joint -->
        <g style="animation: gearSpin 10s infinite linear; transform-origin: 80px 10px;">
          <circle cx="80" cy="10" r="18" class="arm-joint" />
          <path d="M 65 10 L 95 10 M 80 -5 L 80 25 M 68 -2 L 92 22 M 68 22 L 92 -2" stroke="#cbd5e1" stroke-width="2" />
        </g>
        
        <!-- Hand / Injector -->
        <path d="M 100 -10 L 140 0 L 140 20 L 100 30 Z" class="arm-base" />
        
        <!-- The Payload -->
        <circle cx="150" cy="10" r="12" style="animation: payloadGlow 10s infinite;" />
        <path d="M 140 5 L 160 5 L 160 15 L 140 15 Z" fill="#ffffff" opacity="0.8" />
      </g>
    </g>

    <!-- Lockdown Wall (Triggers on Abort) -->
    <rect x="420" y="150" width="10" height="0" rx="4" style="animation: lockdownWall 10s infinite;" />
  </g>

  <!-- Labels -->
  <text x="400" y="40" fill="#94a3b8" font-family="monospace" font-size="16px" font-weight="bold" text-anchor="middle">IDEMPOTENCY KERNEL: EDIT EXECUTION</text>
  <text x="400" y="270" fill="#64748b" font-family="sans-serif" font-size="12px" text-anchor="middle">Agent attempts edit → Fails (mismatch) → Retries ONCE → Aborts permanently. No infinite loops.</text>

</svg>
