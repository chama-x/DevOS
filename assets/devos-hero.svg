<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Fira+Code:wght@400;500&amp;display=swap');
      .bg { fill: #0d1117; }
      .window-bg { fill: #1e1e1e; stroke: #30363d; stroke-width: 1.5; }
      .sidebar { fill: #181818; stroke-right: #30363d; }
      .text-dim { fill: #8b949e; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; }
      .text-tree { fill: #c9d1d9; font-family: 'Inter', sans-serif; font-size: 15px; }
      .text-tree-highlight { fill: #58a6ff; font-weight: 600; }
      .text-code { font-family: 'Fira Code', monospace; font-size: 15px; fill: #e6edf3; }
      .text-chat { font-family: 'Inter', sans-serif; font-size: 16px; fill: #e6edf3; line-height: 1.5; }
      
      .bubble-user { fill: #238636; rx: 8; }
      .bubble-system { fill: #21262d; rx: 6; stroke: #30363d; stroke-width: 1; }
      .bubble-agent { fill: #161b22; rx: 8; stroke: #30363d; stroke-width: 1; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="675" />
  
  <!-- Editor Window -->
  <rect class="window-bg" x="100" y="80" width="1000" height="515" rx="12" filter="url(#shadow)" />
  
  <!-- macOS Controls -->
  <circle cx="125" cy="105" r="6" fill="#ff5f56" />
  <circle cx="145" cy="105" r="6" fill="#ffbd2e" />
  <circle cx="165" cy="105" r="6" fill="#27c93f" />
  
  <!-- Sidebar -->
  <path d="M 100 130 L 350 130 L 350 595 Q 350 595 350 595 L 112 595 Q 100 595 100 583 Z" class="sidebar" />
  <line x1="100" y1="130" x2="1100" y2="130" stroke="#30363d" stroke-width="1.5" />
  <line x1="350" y1="130" x2="350" y2="595" stroke="#30363d" stroke-width="1.5" />
  
  <!-- File Tree -->
  <text x="120" y="165" class="text-dim">EXPLORER</text>
  <text x="120" y="205" class="text-tree">📁 src</text>
  <text x="120" y="235" class="text-tree">📁 components</text>
  <text x="120" y="265" class="text-tree text-tree-highlight">📂 .agents</text>
  <text x="145" y="295" class="text-tree text-tree-highlight">📂 rules</text>
  <text x="170" y="325" class="text-tree text-tree-highlight">📄 IDENTITY.md</text>
  <text x="170" y="355" class="text-tree text-tree-highlight">📄 GROUNDING.md</text>
  <text x="170" y="385" class="text-tree">📄 SKILL_ROUTING.md</text>
  <text x="145" y="415" class="text-tree text-tree-highlight">📄 current.md</text>
  <text x="145" y="445" class="text-tree text-tree-highlight">📄 worklog.md</text>
  <text x="145" y="475" class="text-tree">📁 skills</text>
  
  <!-- Main Editor / Chat Area -->
  <text x="380" y="165" class="text-dim">AI CHAT</text>
  
  <!-- User Bubble -->
  <rect class="bubble-user" x="720" y="190" width="340" height="45" />
  <text x="740" y="218" class="text-chat" fill="#ffffff">Add a date picker to the booking form.</text>
  
  <!-- System Bubble (Interception) -->
  <rect class="bubble-system" x="380" y="255" width="450" height="75" />
  <text x="400" y="282" class="text-code" fill="#8b949e">&gt; Reading <tspan fill="#58a6ff">.agents/rules/IDENTITY.md</tspan>...</text>
  <text x="400" y="310" class="text-code" fill="#7ee787">✓ Project boundaries loaded.</text>
  
  <!-- Agent Bubble -->
  <rect class="bubble-agent" x="380" y="350" width="560" height="100" />
  <circle cx="410" cy="385" r="14" fill="#58a6ff" opacity="0.2"/>
  <circle cx="410" cy="385" r="7" fill="#58a6ff"/>
  <text x="440" y="380" class="text-chat">Rule found in IDENTITY.md: <tspan font-style="italic" fill="#8b949e">"No custom date pickers —</tspan></text>
  <text x="440" y="405" class="text-chat"><tspan font-style="italic" fill="#8b949e">native HTML input only."</tspan></text>
  <text x="440" y="435" class="text-chat">I will add a native HTML <tspan class="text-code" fill="#ff7b72">&lt;input type="date"&gt;</tspan> to the form.</text>
  
</svg>