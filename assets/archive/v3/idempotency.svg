<svg width="720" height="450" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Idempotency and the Recovery Kernel">
  <style>
    /* Master cycle: 12s. extend → fire#1 → repel → adjust → fire#2 → fail → retract → LOCKDOWN */
    .arm-carriage { animation: armMove 12s ease-in-out forwards; }
    @keyframes armMove {
      0%,4%   { transform: translateX(0); }
      12%,20% { transform: translateX(70px); }   /* attempt 1 */
      26%,30% { transform: translateX(18px); }   /* recoil */
      38%,46% { transform: translateX(70px); }   /* attempt 2 */
      56%,96% { transform: translateX(-30px); }  /* full retract */
      100%    { transform: translateX(0); }
    }
    .forearm { transform-box: fill-box; transform-origin: 12px 50%; animation: forearmTilt 12s ease-in-out forwards; }
    @keyframes forearmTilt {
      0%,4% { transform: rotate(8deg); } 12%,20% { transform: rotate(0deg); }
      26%,30% { transform: rotate(14deg); } 38%,46% { transform: rotate(0deg); }
      56%,96% { transform: rotate(22deg); } 100% { transform: rotate(8deg); }
    }
    .joint-gear { transform-box: fill-box; transform-origin: center; animation: jointSpin 12s linear forwards; }
    @keyframes jointSpin {
      0%,20% { transform: rotate(0deg); }
      26%,36% { transform: rotate(-300deg); }   /* recalibration spin */
      46%,100% { transform: rotate(-300deg); }
    }
    .beam { stroke: #ff2244; stroke-width: 5; stroke-linecap: round; filter: url(#glowR); opacity: 0;
      animation: beamFire 12s linear forwards; }
    @keyframes beamFire {
      0%,12% { opacity: 0; } 13%,19% { opacity: 1; } 20%,38% { opacity: 0; }
      39%,45% { opacity: 1; } 46%,100% { opacity: 0; }
    }
    .beam-core { stroke: #ffd9e0; stroke-width: 1.5; }
    .ripple { fill: none; stroke: #22d3ee; stroke-width: 3; transform-box: fill-box; transform-origin: center;
      opacity: 0; animation: rippleHit 12s ease-out forwards; }
    @keyframes rippleHit {
      0%,13% { opacity: 0; transform: scale(.2); }
      14% { opacity: 1; transform: scale(.3); } 20% { opacity: 0; transform: scale(1.6); }
      21%,39% { opacity: 0; transform: scale(.2); }
      40% { opacity: 1; transform: scale(.3); } 46% { opacity: 0; transform: scale(1.6); }
      47%,100% { opacity: 0; }
    }
    .shield-flash { opacity: 0; animation: shieldGlow 12s linear forwards; }
    @keyframes shieldGlow {
      0%,12% { opacity: 0; } 14%,18% { opacity: .9; } 22%,38% { opacity: 0; }
      40%,44% { opacity: .9; } 48%,100% { opacity: 0; }
    }
    .arm-lights { animation: powerDown 12s linear forwards; }
    @keyframes powerDown { 0%,52% { opacity: 1; } 60%,95% { opacity: .08; } 100% { opacity: 1; } }
    .lamp-1 { opacity: 0; animation: lamp1 12s linear forwards; fill: #ffb020; filter: url(#glowA); }
    @keyframes lamp1 { 0%,13% { opacity: 0; } 14%,95% { opacity: 1; } 96%,100% { opacity: 0; } }
    .lamp-2 { opacity: 0; animation: lamp2 12s linear forwards; fill: #ff2244; filter: url(#glowR); }
    @keyframes lamp2 { 0%,40% { opacity: 0; } 41%,95% { opacity: 1; } 96%,100% { opacity: 0; } }
    .barrier { animation: lockdown 12s cubic-bezier(.6,0,.8,1) forwards; }
    @keyframes lockdown {
      0%,58% { transform: translateY(-260px); }
      66%,94% { transform: translateY(0); }
      100% { transform: translateY(-260px); }
    }
    .abort-glyph { opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: abortIn 12s ease forwards; }
    @keyframes abortIn {
      0%,66% { opacity: 0; transform: scale(.4); }
      70%,93% { opacity: 1; transform: scale(1); }
      97%,100% { opacity: 0; transform: scale(.4); }
    }
    .hex-idle { animation: hexBreath 3s ease-in-out infinite alternate; }
    @keyframes hexBreath { from { opacity: .5; } to { opacity: .9; } }
    .module-glow { animation: modPulse 1.4s ease-in-out infinite alternate; }
    @keyframes modPulse { from { opacity: .6; } to { opacity: 1; } }
    .spark { fill: #ffd166; opacity: 0; animation: sparks 12s linear forwards; }
    @keyframes sparks {
      0%,13% { opacity: 0; transform: translate(0,0); }
      15% { opacity: 1; } 19% { opacity: 0; transform: translate(-16px,-14px); }
      20%,39% { opacity: 0; transform: translate(0,0); }
      41% { opacity: 1; } 45% { opacity: 0; transform: translate(-16px,10px); }
      46%,100% { opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0d1226"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44526e"/><stop offset=".5" stop-color="#232c42"/><stop offset="1" stop-color="#141a2c"/>
    </linearGradient>
    <linearGradient id="hazard" x1="0" y1="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"
      x2="24" y2="24">
      <stop offset="0" stop-color="#ffb020"/><stop offset=".5" stop-color="#ffb020"/>
      <stop offset=".5" stop-color="#141a2c"/><stop offset="1" stop-color="#141a2c"/>
    </linearGradient>
    <filter id="glowR" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowC" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowA" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="hex" d="M0 -26 L22.5 -13 L22.5 13 L0 26 L-22.5 13 L-22.5 -13 Z"/>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)"/>
  <g stroke="#101a33" stroke-width="1">
    <path d="M0 440 H800 M0 470 H800"/><path d="M40 0 V500 M760 0 V500" opacity=".5"/>
  </g>
  <rect x="0" y="440" width="800" height="60" fill="#0a0f1e"/>

  <!-- ===== Hexagonal shield grid (target) ===== -->
  <g transform="translate(618 235)">
    <g fill="#0c1a33" stroke="#1f4a7a" stroke-width="2" class="hex-idle">
      <use href="#hex" x="0" y="-78"/><use href="#hex" x="0" y="-26"/><use href="#hex" x="0" y="26"/><use href="#hex" x="0" y="78"/>
      <use href="#hex" x="45" y="-52"/><use href="#hex" x="45" y="0"/><use href="#hex" x="45" y="52"/>
      <use href="#hex" x="90" y="-78"/><use href="#hex" x="90" y="-26"/><use href="#hex" x="90" y="26"/><use href="#hex" x="90" y="78"/>
      <use href="#hex" x="135" y="-52"/><use href="#hex" x="135" y="0"/><use href="#hex" x="135" y="52"/>
    </g>
    <g class="shield-flash" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glowC)">
      <use href="#hex" x="0" y="-26"/><use href="#hex" x="0" y="26"/><use href="#hex" x="45" y="0"/>
    </g>
    <circle class="ripple" cx="-14" cy="0" r="34"/>
    <circle class="ripple" cx="-14" cy="0" r="22" style="animation-delay:.12s"/>
  </g>

  <!-- ===== Robotic arm ===== -->
  <g>
    <rect x="30" y="330" width="150" height="110" rx="10" fill="url(#metal)" stroke="#44526e" stroke-width="2"/>
    <rect x="48" y="348" width="114" height="20" rx="4" fill="#0d1226" stroke="#2a3654"/>
    <circle class="lamp-1" cx="62" cy="358" r="5"/>
    <circle class="lamp-2" cx="84" cy="358" r="5"/>
    <g class="arm-lights">
      <circle cx="150" cy="358" r="5" fill="#22ff88" filter="url(#glowA)"/>
      <rect x="48" y="382" width="114" height="8" rx="4" fill="#182236"/>
      <rect x="48" y="398" width="80" height="8" rx="4" fill="#182236"/>
    </g>
    <g class="arm-carriage">
      <rect x="80" y="290" width="70" height="48" rx="8" fill="url(#metal)" stroke="#5b6b8c" stroke-width="2"/>
      <g class="joint-gear">
        <circle cx="150" cy="310" r="20" fill="#232c42" stroke="#7688ad" stroke-width="2.5"/>
        <path d="M150 292 v8 M150 320 v8 M132 310 h8 M160 310 h8 M137 297 l6 6 M157 317 l6 6 M163 297 l-6 6 M143 317 l-6 6"
              stroke="#7688ad" stroke-width="3" stroke-linecap="round"/>
        <circle cx="150" cy="310" r="5" fill="#0d1226"/>
      </g>
      <g transform="translate(138 296)">
        <g class="forearm">
        <rect x="10" y="4" width="160" height="22" rx="10" fill="url(#metal)" stroke="#5b6b8c" stroke-width="2"/>
        <rect x="40" y="8" width="60" height="14" rx="6" fill="#182236"/>
        <g class="arm-lights">
          <circle cx="56" cy="15" r="3.5" fill="#22d3ee" filter="url(#glowC)"/>
          <circle cx="72" cy="15" r="3.5" fill="#22d3ee" filter="url(#glowC)"/>
          <circle cx="88" cy="15" r="3.5" fill="#22d3ee" filter="url(#glowC)"/>
        </g>
        <path d="M170 2 l26 6 v14 l-26 6 Z" fill="#2c3a58" stroke="#7688ad" stroke-width="2"/>
        <rect x="196" y="9" width="12" height="12" rx="2" fill="#0d1226" stroke="#ff5f7a" stroke-width="1.5"/>
        <!-- code module payload -->
        <g class="module-glow">
          <rect x="150" y="-14" width="26" height="14" rx="3" fill="#123322" stroke="#22ff88" stroke-width="1.5" filter="url(#glowA)"/>
          <path d="M156 -10 l-3 3 3 3 M170 -10 l3 3 -3 3" stroke="#22ff88" stroke-width="1.5" fill="none"/>
        </g>
        <!-- welding beam -->
        <line class="beam" x1="210" y1="15" x2="390" y2="-58"/>
        <line class="beam beam-core" x1="210" y1="15" x2="390" y2="-58"/>
        </g>
      </g>
    </g>
    <g class="spark"><circle cx="590" cy="238" r="3"/><circle cx="598" cy="228" r="2"/><circle cx="584" cy="248" r="2.5"/></g>
  </g>

  <!-- ===== Lockdown barrier ===== -->
  <g class="barrier">
    <rect x="470" y="30" width="16" height="410" fill="url(#metal)" stroke="#44526e"/>
    <rect x="440" y="30" width="76" height="26" rx="6" fill="#232c42" stroke="#5b6b8c" stroke-width="2"/>
    <rect x="466" y="56" width="24" height="384" fill="url(#hazard)" stroke="#0a0f1e" stroke-width="2"/>
    <rect x="452" y="424" width="52" height="16" rx="4" fill="#232c42" stroke="#5b6b8c" stroke-width="2"/>
  </g>
  <g class="abort-glyph">
    <circle cx="478" cy="240" r="34" fill="#1a0810" stroke="#ff2244" stroke-width="4" filter="url(#glowR)"/>
    <line x1="456" y1="240" x2="500" y2="240" stroke="#ff2244" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
