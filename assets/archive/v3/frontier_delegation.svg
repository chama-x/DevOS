<svg width="720" height="450" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frontier Model Delegation">
  <style>
    /* Master relay: 12s. uplink packet → station compute → wide downlink beam */
    .star { animation: twinkle 3s ease-in-out infinite alternate; }
    @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }

    .dish-head { transform-box: fill-box; transform-origin: 80% 80%; animation: track 12s ease-in-out infinite; }
    @keyframes track {
      0%,8% { transform: rotate(6deg); } 20%,70% { transform: rotate(-4deg); } 90%,100% { transform: rotate(6deg); }
    }
    .packet { animation: uplink 12s cubic-bezier(.45,.1,.6,.9) infinite; }
    @keyframes uplink {
      0%,6%  { transform: translate(0,0) scale(1); opacity: 0; }
      8%     { opacity: 1; }
      28%    { transform: translate(388px,-268px) scale(.55); opacity: 1; }
      30%,100% { transform: translate(388px,-268px) scale(.2); opacity: 0; }
    }
    .uplink-trail { stroke-dasharray: 5 16; opacity: 0; animation: trailUp 12s linear infinite; }
    @keyframes trailUp {
      0%,6% { opacity: 0; } 9%,27% { opacity: .8; stroke-dashoffset: 0; }
      27.01% { stroke-dashoffset: -210; } 31%,100% { opacity: 0; }
    }
    .wing { transform-box: fill-box; transform-origin: center; animation: wingSpin 14s linear infinite; }
    @keyframes wingSpin { to { transform: rotate(360deg); } }
    .proc { opacity: .15; animation: compute 12s linear infinite; }
    @keyframes compute {
      0%,29% { opacity: .15; }
      31% { opacity: 1; } 34% { opacity: .2; } 37% { opacity: 1; } 40% { opacity: .25; }
      43% { opacity: 1; } 47% { opacity: 1; } 55%,100% { opacity: .15; }
    }
    .hub-core { transform-box: fill-box; transform-origin: center; animation: hubCharge 12s ease infinite; }
    @keyframes hubCharge {
      0%,28% { transform: scale(1); opacity: .5; }
      45%   { transform: scale(1.35); opacity: 1; }
      52%   { transform: scale(1.1); opacity: 1; }
      75%   { transform: scale(1); opacity: .6; }
      100%  { transform: scale(1); opacity: .5; }
    }
    .downbeam { transform-box: fill-box; transform-origin: top center; animation: beamDown 12s ease infinite; }
    @keyframes beamDown {
      0%,48% { transform: scaleY(0); opacity: 0; }
      54%    { transform: scaleY(1); opacity: .95; }
      80%    { transform: scaleY(1); opacity: .95; }
      90%,100% { transform: scaleY(1); opacity: 0; }
    }
    .beam-data { stroke-dasharray: 14 22; animation: dataFall 1s linear infinite, beamDataFade 12s linear infinite; }
    @keyframes dataFall { to { stroke-dashoffset: 36; } }
    @keyframes beamDataFade { 0%,50% { opacity: 0; } 55%,80% { opacity: 1; } 88%,100% { opacity: 0; } }
    .rx-glow { opacity: 0; transform-box: fill-box; transform-origin: center; animation: rxPulse 12s ease infinite; }
    @keyframes rxPulse {
      0%,54% { opacity: 0; transform: scale(.4); }
      60% { opacity: 1; transform: scale(1); }
      80% { opacity: .8; transform: scale(1.15); }
      90%,100% { opacity: 0; transform: scale(.4); }
    }
    .ground-lamp { animation: gLamp 12s linear infinite; }
    @keyframes gLamp { 0%,53% { fill: #ffb020; } 56%,88% { fill: #22ff88; } 92%,100% { fill: #ffb020; } }
    .orbit-ring { transform-box: fill-box; transform-origin: center; animation: wingSpin 30s linear infinite reverse; }
  </style>

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02030c"/><stop offset=".7" stop-color="#081228"/><stop offset="1" stop-color="#0d1f38"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#0c2c6e"/><stop offset="1" stop-color="#071a44"/>
    </linearGradient>
    <linearGradient id="hull4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5878"/><stop offset=".5" stop-color="#242e4a"/><stop offset="1" stop-color="#131a30"/>
    </linearGradient>
    <filter id="glowV" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowC4" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="500" fill="url(#space)"/>
  <!-- starfield -->
  <g fill="#cfe8ff">
    <circle class="star" cx="60" cy="50" r="1.4"/><circle class="star" cx="180" cy="90" r="1" style="animation-delay:.7s"/>
    <circle class="star" cx="320" cy="40" r="1.6" style="animation-delay:1.2s"/><circle class="star" cx="450" cy="120" r="1" style="animation-delay:.3s"/>
    <circle class="star" cx="700" cy="60" r="1.3" style="animation-delay:1.8s"/><circle class="star" cx="760" cy="180" r="1" style="animation-delay:.9s"/>
    <circle class="star" cx="120" cy="180" r="1.1" style="animation-delay:2.2s"/><circle class="star" cx="260" cy="140" r="1" style="animation-delay:1.5s"/>
    <circle class="star" cx="540" cy="40" r="1.2" style="animation-delay:.5s"/><circle class="star" cx="380" cy="200" r="1" style="animation-delay:2.6s"/>
  </g>

  <!-- ===== Frontier space station (top-right) ===== -->
  <g transform="translate(600 120)">
    <ellipse class="orbit-ring" rx="120" ry="42" fill="none" stroke="#312e81" stroke-width="1.5" stroke-dasharray="4 10"/>
    <!-- rotating solar wings -->
    <g class="wing">
      <g transform="translate(-118 0)">
        <rect x="-56" y="-16" width="56" height="32" rx="3" fill="url(#panel)" stroke="#3b82f6" stroke-width="1.5"/>
        <path d="M-42 -16 v32 M-28 -16 v32 M-14 -16 v32 M-56 0 h56" stroke="#1e3a8a" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="40" y2="0" stroke="#64748b" stroke-width="4"/>
      </g>
      <g transform="translate(118 0)">
        <rect x="0" y="-16" width="56" height="32" rx="3" fill="url(#panel)" stroke="#3b82f6" stroke-width="1.5"/>
        <path d="M14 -16 v32 M28 -16 v32 M42 -16 v32 M0 0 h56" stroke="#1e3a8a" stroke-width="1.5"/>
        <line x1="0" y1="0" x2="-40" y2="0" stroke="#64748b" stroke-width="4"/>
      </g>
    </g>
    <!-- hub -->
    <circle r="46" fill="url(#hull4)" stroke="#5b6b8c" stroke-width="2.5"/>
    <circle r="46" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="10 8" opacity=".7"/>
    <circle class="hub-core" r="18" fill="#7c3aed" filter="url(#glowV)"/>
    <circle class="hub-core" r="8" fill="#e9d5ff" style="animation-delay:.1s"/>
    <!-- processor windows -->
    <g fill="#22d3ee" filter="url(#glowC4)">
      <rect class="proc" x="-36" y="-30" width="10" height="6" rx="1.5"/>
      <rect class="proc" x="-36" y="-18" width="10" height="6" rx="1.5" style="animation-delay:.15s"/>
      <rect class="proc" x="26"  y="-30" width="10" height="6" rx="1.5" style="animation-delay:.3s"/>
      <rect class="proc" x="26"  y="-18" width="10" height="6" rx="1.5" style="animation-delay:.45s"/>
      <rect class="proc" x="-36" y="22"  width="10" height="6" rx="1.5" style="animation-delay:.6s"/>
      <rect class="proc" x="26"  y="22"  width="10" height="6" rx="1.5" style="animation-delay:.75s"/>
    </g>
    <rect x="-8" y="-64" width="16" height="20" rx="4" fill="url(#hull4)" stroke="#5b6b8c"/>
    <circle cx="0" cy="-68" r="4" fill="#ff3355" filter="url(#glowC4)"/>
  </g>

  <!-- ===== Downlink beam ===== -->
  <g class="downbeam">
    <polygon points="566,166 634,166 700,430 480,430" fill="url(#beamG)" filter="url(#glowV)"/>
    <g stroke="#e9d5ff" stroke-width="2" fill="none" class="beam-data">
      <line x1="560" y1="180" x2="520" y2="424"/>
      <line x1="600" y1="172" x2="592" y2="426"/>
      <line x1="638" y1="180" x2="668" y2="424"/>
    </g>
  </g>
  <ellipse class="rx-glow" cx="590" cy="432" rx="120" ry="14" fill="#7c3aed" filter="url(#glowV)"/>

  <!-- ===== Ground terrain ===== -->
  <path d="M0 432 L120 424 L260 436 L420 426 L580 434 L720 426 L800 432 V500 H0 Z" fill="#0a1220" stroke="#1c2c44" stroke-width="2"/>
  <path d="M0 452 H800 M0 476 H800" stroke="#122036" stroke-width="1.5"/>

  <!-- ===== AgentOS ground dish array ===== -->
  <g transform="translate(150 340)">
    <!-- uplink trail + packet -->
    <line class="uplink-trail" x1="52" y1="-6" x2="440" y2="-274" stroke="#22ff88" stroke-width="2.5" filter="url(#glowC4)"/>
    <g class="packet" filter="url(#glowC4)">
      <rect x="44" y="-14" width="16" height="16" rx="3" transform="rotate(45 52 -6)" fill="#052e16" stroke="#22ff88" stroke-width="2"/>
      <circle cx="52" cy="-6" r="3" fill="#baffdd"/>
    </g>
    <!-- station base -->
    <rect x="-30" y="60" width="150" height="34" rx="6" fill="url(#hull4)" stroke="#3b4a68" stroke-width="2"/>
    <circle class="ground-lamp" cx="-12" cy="77" r="5" filter="url(#glowC4)"/>
    <rect x="8" y="70" width="66" height="14" rx="3" fill="#060d1a" stroke="#2a3a58"/>
    <path d="M14 77 h8 M28 77 h8 M42 77 h8 M56 77 h8" stroke="#22d3ee" stroke-width="2.5" opacity=".8"/>
    <!-- pedestal + dish -->
    <path d="M28 60 L44 8 h14 L74 60 Z" fill="url(#hull4)" stroke="#3b4a68" stroke-width="2"/>
    <g transform="translate(30 -22)">
      <g class="dish-head">
      <path d="M-26 26 A46 46 0 0 1 44 -30 L26 42 Z" fill="url(#hull4)" stroke="#7d92b8" stroke-width="2.5"/>
      <path d="M-18 20 A34 34 0 0 1 34 -22" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".7"/>
      <path d="M-8 12 A20 20 0 0 1 22 -12" fill="none" stroke="#22d3ee" stroke-width="1.2" opacity=".5"/>
      <line x1="8" y1="6" x2="34" y2="-16" stroke="#7d92b8" stroke-width="3"/>
      <circle cx="36" cy="-18" r="5" fill="#22ff88" filter="url(#glowC4)"/>
      </g>
    </g>
    <!-- companion mini-dishes -->
    <g transform="translate(-72 46) scale(.5)"><path d="M-26 26 A46 46 0 0 1 44 -30 L26 42 Z" fill="url(#hull4)" stroke="#546e8c" stroke-width="2"/><path d="M0 40 L10 90 h-20 Z" fill="#1c2740"/></g>
    <g transform="translate(210 52) scale(.42)"><path d="M-26 26 A46 46 0 0 1 44 -30 L26 42 Z" fill="url(#hull4)" stroke="#3b4a68" stroke-width="2"/><path d="M0 40 L10 90 h-20 Z" fill="#1c2740"/></g>
  </g>
</svg>
